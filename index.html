<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chick & Chips | El Combo Perfecto</title>
  <!-- FontAwesome para Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Fuente Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #120e0c;
      --card-bg: #1d1714;
      --primary-red: #ff3333;
      --primary-red-hover: #e02424;
      --accent-yellow: #ffb703;
      --text-light: #fff8f0;
      --text-muted: #a89f91;
      --border-color: #2e231f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding-bottom: 100px;
    }

    /* HEADER */
    header {
      background: linear-gradient(180deg, #2b0b08 0%, var(--bg-dark) 100%);
      padding: 28px 16px 18px;
      text-align: center;
      border-bottom: 3px solid var(--primary-red);
      box-shadow: 0 4px 20px rgba(255, 51, 51, 0.25);
    }

    .brand-badge {
      display: inline-block;
      background: var(--text-light);
      padding: 6px 20px;
      border-radius: 50px;
      border: 3px solid var(--primary-red);
      margin-bottom: 8px;
    }

    .brand-title {
      font-size: 28px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--primary-red);
      line-height: 1;
    }

    .brand-slogan {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent-yellow);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-top: 6px;
    }

    /* BARRA DE CATEGORÍAS */
    .categories-container {
      padding: 18px 16px 10px;
      max-width: 600px;
      margin: 0 auto;
    }

    .categories-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .categories {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: thin;
      scrollbar-color: var(--primary-red) var(--card-bg);
    }

    .categories::-webkit-scrollbar {
      height: 6px;
    }
    .categories::-webkit-scrollbar-thumb {
      background: var(--primary-red);
      border-radius: 10px;
    }

    .cat-btn {
      background: var(--card-bg);
      color: var(--text-light);
      border: 1px solid var(--border-color);
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease-in-out;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .cat-btn.active, .cat-btn:hover {
      background: var(--primary-red);
      color: #ffffff;
      border-color: var(--primary-red);
      box-shadow: 0 4px 15px rgba(255, 51, 51, 0.4);
      transform: translateY(-2px);
    }

    /* LISTA DE PRODUCTOS */
    .container {
      padding: 10px 16px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .product-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 16px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid var(--border-color);
      box-shadow: 0 6px 15px rgba(0,0,0,0.4);
      transition: transform 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 51, 51, 0.3);
    }

    .product-info {
      flex: 1;
      padding-right: 14px;
    }

    .product-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-light);
      margin-bottom: 4px;
    }

    .product-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .product-price {
      font-size: 18px;
      font-weight: 900;
      color: var(--accent-yellow);
    }

    .add-btn {
      background: var(--primary-red);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 10px rgba(255, 51, 51, 0.3);
    }

    .add-btn:active {
      transform: scale(0.95);
      background: var(--primary-red-hover);
    }

    /* CARRITO FLOTANTE INFERIOR */
    .cart-bar {
      position: fixed;
      bottom: 18px;
      left: 16px;
      right: 16px;
      max-width: 568px;
      margin: 0 auto;
      background: var(--accent-yellow);
      color: #000;
      border-radius: 20px;
      padding: 14px 22px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 30px rgba(255, 183, 3, 0.45);
      cursor: pointer;
      z-index: 90;
      font-weight: 800;
      transition: transform 0.2s ease;
    }

    .cart-bar:active {
      transform: scale(0.98);
    }

    .cart-bar-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cart-count {
      background: #000;
      color: #fff;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 14px;
    }

    .cart-bar-text {
      font-size: 15px;
    }

    /* MODAL DE CARRITO Y CHECKOUT */
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: none;
      justify-content: center;
      align-items: flex-end;
      z-index: 100;
      backdrop-filter: blur(5px);
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: var(--card-bg);
      width: 100%;
      max-width: 600px;
      border-radius: 28px 28px 0 0;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      color: var(--text-light);
      border-top: 4px solid var(--accent-yellow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 14px;
      margin-bottom: 18px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 800;
      color: var(--accent-yellow);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 26px;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-color);
    }

    .cart-item-title {
      font-size: 14px;
      font-weight: 600;
    }

    .cart-item-price {
      font-size: 13px;
      color: var(--accent-yellow);
    }

    .quantity-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .qty-btn {
      background: var(--border-color);
      border: none;
      color: white;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .form-group {
      margin-top: 16px;
    }

    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-control {
      width: 100%;
      background: var(--bg-dark);
      border: 1px solid var(--border-color);
      padding: 12px 14px;
      border-radius: 10px;
      color: white;
      font-size: 14px;
    }

    .form-control:focus {
      outline: none;
      border-color: var(--accent-yellow);
    }

    .cart-summary {
      margin-top: 20px;
      padding-top: 14px;
      border-top: 2px dashed var(--border-color);
    }

    .summary-total {
      font-size: 18px;
      font-weight: 800;
      display: flex;
      justify-content: space-between;
    }

    .btn-send-wa {
      background: #25d366;
      color: #fff;
      width: 100%;
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 800;
      margin-top: 20px;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 18px rgba(37, 211, 102, 0.4);
      transition: background 0.2s;
    }

    .btn-send-wa:hover {
      background: #1eb857;
    }
  </style>
</head>
<body>

  <!-- ENCABEZADO Y LOGO -->
  <header>
    <div class="brand-badge">
      <div class="brand-title">CHICK & CHIPS</div>
    </div>
    <div class="brand-slogan">EL COMBO PERFECTO DE TU DÍA</div>
  </header>

  <!-- BOTONES DE CATEGORÍAS -->
  <div class="categories-container">
    <div class="categories-title">Selecciona una Categoría:</div>
    <div class="categories">
      <button class="cat-btn active" onclick="filterCategory('papipollo', this)">🍗 Papi Pollo</button>
      <button class="cat-btn" onclick="filterCategory('salchipapa', this)">🍟 Salchipapas</button>
      <button class="cat-btn" onclick="filterCategory('hamburguesas', this)">🍔 Hamburguesas</button>
      <button class="cat-btn" onclick="filterCategory('extras', this)">🥤 Extras & Bebidas</button>
    </div>
  </div>

  <!-- MENÚ DE PRODUCTOS -->
  <div class="container" id="menuContainer"></div>

  <!-- BARRA DE CARRITO FLOTANTE -->
  <div class="cart-bar" id="cartBar" style="display: none;" onclick="openCartModal()">
    <div class="cart-bar-info">
      <span class="cart-count" id="cartBadge">0</span>
      <span class="cart-bar-text">Ver Mi Pedido</span>
    </div>
    <div class="cart-bar-text" id="cartBarTotal">$0.00</div>
  </div>

  <!-- MODAL DEL CARRITO Y PAGO -->
  <div class="modal" id="cartModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-cart-shopping"></i> Tu Pedido - Chick & Chips
        </div>
        <button class="close-btn" onclick="closeCartModal()">&times;</button>
      </div>

      <div id="cartItemsList"></div>

      <div class="form-group">
        <label>👤 Tu Nombre:</label>
        <input type="text" id="clientName" class="form-control" placeholder="Ej: Juan Pérez">
      </div>

      <div class="form-group">
        <label>📍 Dirección de Entrega / Referencia:</label>
        <input type="text" id="clientAddress" class="form-control" placeholder="Ej: Av. Central y Calle 4">
      </div>

      <div class="form-group">
        <label>💳 Método de Pago:</label>
        <select id="paymentMethod" class="form-control">
          <option value="Efectivo">Efectivo</option>
          <option value="Transferencia / Deuna">Transferencia / Deuna</option>
        </select>
      </div>

      <div class="cart-summary">
        <div class="summary-total">
          <span>TOTAL A PAGAR:</span>
          <span id="totalAmount" style="color: var(--accent-yellow);">$0.00</span>
        </div>
      </div>

      <button class="btn-send-wa" onclick="sendOrderToWhatsApp()">
        <i class="fa-brands fa-whatsapp fa-xl"></i> HACER PEDIDO POR WHATSAPP
      </button>
    </div>
  </div>

  <!-- JAVASCRIPT -->
  <script>
    // ⚙️ NÚMERO DE WHATSAPP DEL NEGOCIO
    const WHATSAPP_PHONE = "593982565003";

    // BASE DE DATOS DE PRODUCTOS ACTUALIZADA
    const products = [
      // 🍗 PAPI POLLO
      { 
        id: 1, 
        category: 'papipollo', 
        name: 'Papi Pollo', 
        desc: 'porción grande de papas + presa de pollo + 3 salsa', 
        price: 2.50 
      },
      { 
        id: 2, 
        category: 'papipollo', 
        name: 'Popcorn + papas', 
        desc: 'popcron de pechuga de pollo + papas pequeña + 3 salsas', 
        price: 2.00 
      },

      // 🍟 SALCHIPAPAS
      { 
        id: 3, 
        category: 'salchipapa', 
        name: 'Salchipapa', 
        desc: 'porción mediana de papas + salchichas fritas + 2 salsas', 
        price: 1.50 
      },

      // 🍔 HAMBURGUESAS
      { 
        id: 4, 
        category: 'hamburguesas', 
        name: 'Hamburguesa Normal', 
        desc: 'hamburguesa normal + porción pequeña de papas + 3 salsas.', 
        price: 2.00 
      },
      { 
        id: 5, 
        category: 'hamburguesas', 
        name: 'Hamburguesa Completa', 
        desc: 'hamburguesa con huevo frito y tocino + porción mediana de papas + 3 salsas + bebida.', 
        price: 3.50 
      },

      // 🥤 EXTRAS & BEBIDAS
      { 
        id: 6, 
        category: 'extras', 
        name: 'Bebida personal Coca-Cola', 
        desc: 'Bebida helada personal', 
        price: 0.50 
      },
      { 
        id: 7, 
        category: 'extras', 
        name: 'Bebida personal Sprite', 
        desc: 'Bebida helada personal', 
        price: 0.50 
      },
      { 
        id: 8, 
        category: 'extras', 
        name: 'Bebida personal Pepsi', 
        desc: 'Bebida helada personal', 
        price: 0.50 
      },
      { 
        id: 9, 
        category: 'extras', 
        name: 'Bebida personal Fioravanti', 
        desc: 'Bebida helada personal', 
        price: 0.50 
      },
      { 
        id: 10, 
        category: 'extras', 
        name: 'Bebida personal Fanta', 
        desc: 'Bebida helada personal', 
        price: 0.50 
      },
      { 
        id: 11, 
        category: 'extras', 
        name: 'Presa de Pollo - Pierna', 
        desc: 'Pierna de pollo dorada y sazonada.', 
        price: 1.50 
      },
      { 
        id: 12, 
        category: 'extras', 
        name: 'Presa de Pollo - Pos Pierna', 
        desc: 'Pos pierna de pollo dorada y sazonada.', 
        price: 1.50 
      },
      { 
        id: 13, 
        category: 'extras', 
        name: 'Presa de Pollo - Popcorn', 
        desc: 'Porción de popcorn de pollo crujiente.', 
        price: 1.50 
      },
      { 
        id: 14, 
        category: 'extras', 
        name: 'Mayonesa', 
        desc: 'Salsa cremosa de mayonesa.', 
        price: 0.30 
      },
      { 
        id: 15, 
        category: 'extras', 
        name: 'Salsa de Tomate', 
        desc: 'Salsa clásica de tomate.', 
        price: 0.30 
      },
      { 
        id: 16, 
        category: 'extras', 
        name: 'Salsa de la Casa', 
        desc: 'Sabor especial secreto de la casa.', 
        price: 0.30 
      }
    ];

    let cart = [];

    function renderProducts(filter = 'papipollo') {
      const container = document.getElementById('menuContainer');
      container.innerHTML = '';

      const filtered = products.filter(p => p.category === filter);

      if (filtered.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:30px;">No hay productos disponibles en esta categoría.</p>';
        return;
      }

      filtered.forEach(p => {
        container.innerHTML += `
          <div class="product-card">
            <div class="product-info">
              <div class="product-title">${p.name}</div>
              <div class="product-desc">${p.desc}</div>
              <div class="product-price">$${p.price.toFixed(2)}</div>
            </div>
            <button class="add-btn" onclick="addToCart(${p.id})">
              <i class="fa-solid fa-plus"></i> Añadir
            </button>
          </div>
        `;
      });
    }

    function filterCategory(cat, btn) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(cat);
    }

    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      const itemInCart = cart.find(item => item.id === productId);

      if (itemInCart) {
        itemInCart.qty += 1;
      } else {
        cart.push({ ...product, qty: 1 });
      }

      updateCartUI();
    }

    function changeQuantity(productId, delta) {
      const item = cart.find(p => p.id === productId);
      if (!item) return;

      item.qty += delta;
      if (item.qty <= 0) {
        cart = cart.filter(p => p.id !== productId);
      }
      updateCartUI();
    }

    function updateCartUI() {
      const totalCount = cart.reduce((sum, item) => sum + item.qty, 0);
      const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

      const cartBar = document.getElementById('cartBar');
      if (totalCount > 0) {
        cartBar.style.display = 'flex';
        document.getElementById('cartBadge').innerText = totalCount;
        document.getElementById('cartBarTotal').innerText = `$${totalPrice.toFixed(2)}`;
      } else {
        cartBar.style.display = 'none';
        closeCartModal();
      }

      renderCartModalItems();
    }

    function renderCartModalItems() {
      const container = document.getElementById('cartItemsList');
      container.innerHTML = '';

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--text-muted); padding:20px;">Tu carrito está vacío.</p>';
        return;
      }

      let totalPrice = 0;

      cart.forEach(item => {
        const itemTotal = item.price * item.qty;
        totalPrice += itemTotal;

        container.innerHTML += `
          <div class="cart-item">
            <div>
              <div class="cart-item-title">${item.name}</div>
              <div class="cart-item-price">$${item.price.toFixed(2)} c/u</div>
            </div>
            <div class="quantity-controls">
              <button class="qty-btn" onclick="changeQuantity(${item.id}, -1)">-</button>
              <span style="font-weight:bold">${item.qty}</span>
              <button class="qty-btn" onclick="changeQuantity(${item.id}, 1)">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('totalAmount').innerText = `$${totalPrice.toFixed(2)}`;
    }

    function openCartModal() {
      document.getElementById('cartModal').classList.add('open');
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.remove('open');
    }

    function sendOrderToWhatsApp() {
      if (cart.length === 0) return;

      const name = document.getElementById('clientName').value.trim();
      const address = document.getElementById('clientAddress').value.trim();
      const payment = document.getElementById('paymentMethod').value;

      if (!name || !address) {
        alert("Por favor, ingresa tu nombre y dirección de entrega.");
        return;
      }

      let totalPrice = 0;
      let orderDetails = "";

      cart.forEach((item, index) => {
        const itemTotal = item.price * item.qty;
        totalPrice += itemTotal;
        orderDetails += `${index + 1}. *${item.qty}x* ${item.name} -> $${itemTotal.toFixed(2)}\n`;
      });

      const message = 
        `🍗 *NUEVO PEDIDO - CHICK & CHIPS* 🍟\n\n` +
        `👤 *Cliente:* ${name}\n` +
        `📍 *Dirección:* ${address}\n` +
        `💳 *Método de Pago:* ${payment}\n\n` +
        `📝 *DETALLE DEL PEDIDO:*\n${orderDetails}\n` +
        `💰 *TOTAL A PAGAR:* $${totalPrice.toFixed(2)}\n\n` +
        `¡Quedo a la espera de la confirmación!`;

      const whatsappUrl = `https://wa.me/${WHATSAPP_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(whatsappUrl, '_blank');
    }

    // Cargar categoría inicial
    renderProducts('papipollo');
  </script>
</body>
</html>
